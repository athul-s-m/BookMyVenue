<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Book My Venue</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <!-- Header -->
  <header>
    <div class="logo">BookMyVenue</div>
  </header>

  <!-- Hero Section -->
  <section class="hero">
    <img class="hero" src="./assests/images/banner-desktop.jpg" alt="">
  </section>

  <!-- Venue Cards -->
  <section class="venues">
    <h2>Popular Venues</h2>

    <div class="venue-container">
      <div class="venue-card">
        <img src="https://picsum.photos/seed/eventhall/400/250" alt="Venue">
        <div class="venue-info">
          <h3>Royal Wedding Hall</h3>
          <p>Kochi • 500 Guests</p>
          <button>Book Now</button>
        </div>
      </div>

      <div class="venue-card">
        <img src="https://picsum.photos/seed/eventhall/400/250" alt="Venue">
        <div class="venue-info">
          <h3>Grand Event Center</h3>
          <p>Trivandrum • 300 Guests</p>
          <button>Book Now</button>
        </div>
      </div>

      <div class="venue-card">
        <img src="https://picsum.photos/seed/eventhall/400/250" alt="Venue">
        <div class="venue-info">
          <h3>Elite Party Lounge</h3>
          <p>Calicut • 150 Guests</p>
          <button>Book Now</button>
        </div>
      </div>

    </div>
  </section>

  <!-- Footer -->
  <footer>
    <p>© 2026 BookMyVenue. <br> version 0.0.0</p>
  </footer>

</body>
</html>
